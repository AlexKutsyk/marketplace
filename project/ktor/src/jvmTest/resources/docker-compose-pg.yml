version: '3.9'
services:
  psql:
    image: postgres
#    ports:
#      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "skill-grader-pass"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "skill-grader-rules"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  liquibase:
    image: "migration-pg:0.0.1"
    pull_policy: never
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://psql:5432/skill-grader-rules
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: "skill-grader-pass"
      LIQUIBASE_LIQUIBASE_SCHEMA_NAME: public
#      tableName: skill-grader-rules

    depends_on:
      psql:
        condition: service_healthy
